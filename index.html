<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reservas - Restaurante</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="login-container" class="login-overlay">
    <div class="login-box">
      <h2>Acceso Reservas</h2>
      <input type="text" id="loginUser" placeholder="Usuario">
      <input type="password" id="loginPass" placeholder="Contraseña">
      <label><input type="checkbox" id="rememberMe"> Recordar sesión</label>
      <button id="loginBtn">Ingresar</button>
      <p id="loginError" style="color:red;display:none;">Usuario o contraseña incorrectos</p>
    </div>
  </div>



  <div id="container">

    <!-- 🏠 Menú principal -->
    <section id="menu-principal">
      <h1>Barrancas Restaurant</h1>
      <div class="Botones superiores">
        <button id="btnNew" type="button">Hacer una nueva reserva</button>
        <button id="btnView" type="button">Ver reservas</button>
      </div>
      <button id="btnLogout" onclick="cerrarSesion()">Cerrar sesión</button>
    </section>

    <!-- 🆕 Nueva reserva (formulario) -->
    <section id="nueva-reserva" style="display:none;">
      <div class="toolbar">
        <button id="btnBackForm" class="icon-btn">←</button>
        <div class="toolbar-center"><h2>Nueva reserva</h2></div>
        <div class="toolbar-right"></div>
      </div>

      <form id="formReserva">
        <div class="form-grid">
          <label>Fecha</label>
          <input type="date" id="resFecha" required>

          <label>Hora</label>
          <div id="selectorHora" class="hora-grid" style="display:none;"></div>
          <input type="hidden" id="resHora" required>


          <label>Turno</label>
          <div id="turnoButtons" class="turno-selector">
            <button type="button" class="turno-btn" data-turno="almuerzo">Almuerzo</button>
            <button type="button" class="turno-btn" data-turno="merienda">Merienda</button>
            <button type="button" class="turno-btn" data-turno="cena">Cena</button>
          </div>
          <input type="hidden" id="resTurno"  value="almuerzo" required>

          <label>Mesa</label>
          <input type="text" id="resMesa" placeholder="Opcional">


          <label>Pax</label>
          <input type="number" id="resPax" min="1" required>

          <label>Apellido / Nombre</label>
          <input type="text" id="resNombre" required>

          <label>Teléfono / Habitación</label>
          <input type="text" id="resTel">

          <label>Comentarios</label>
          <textarea id="resComent" rows="2"></textarea>
        </div>

        <div class="form-actions">
          <div id="mensajeReserva" class="mensaje-reserva" style="display:none;"></div>
          <button type="submit" class="btn-primary">Guardar reserva</button>
        </div>
      </form>
    </section>

    <!-- 📋 Tabla de reservas -->
    <section id="tabla-reservas" style="display:none;">
      <!-- Barra superior -->
      <div class="toolbar">
        <button id="btnBack" class="icon-btn" title="Volver">←</button>

        <div class="toolbar-center">
          <div id="turnoSelector">
            <button id="btnAlmuerzo" class="turno-btn">Almuerzo</button>
            <input type="date" id="fechaSeleccion" />
            <button id="btnCena" class="turno-btn active">Cena</button>
          </div>
        </div>

        <div class="toolbar-right">
          <span id="diaTexto">—</span>
        </div>
      </div>

      <!-- Controles de rango horario -->
      

      <!-- Tabla -->
      <div class="sheet-wrap">
        <table class="sheet" id="tabla"></table>
      </div>
    </section>

  </div> <!-- /container -->



  <div id="successAnimation">✔</div>
  <!-- 🌗 Botón modo oscuro / claro -->
  <button id="modoToggle" class="modo-toggle" title="Cambiar modo">🌙</button>  
  <!-- Importamos la base de datos de firebase -->

    // TODO: Add SDKs for Firebase products that you want to use
    // https://firebase.google.com/docs/web/setup#available-libraries

    // Your web app's Firebase configuration
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional

  <script type="module" src="script.js"></script>
</body>
</html>
